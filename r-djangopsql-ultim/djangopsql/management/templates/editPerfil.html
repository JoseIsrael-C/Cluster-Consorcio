{% extends "base.html" %}
{% load static %}

{% block title %} Editar perfil {% endblock %}

{% block content %}
    <div class="row mt-3"></div>
    <div class="col-sm-6 mt-3">
        <div class="row">
            <h1>Actualizar perfil</h1>
            <div class="card" >
                <div class="row">
                    <h1>Perfi</h1>
                    <form action="{% url 'editarPerfil' perfil.id %}" method="POST">
                        {% csrf_token %}
                        <!-- <input type="hidden" name="txtIdPerfilUpdate" value="{{perfil.id}}" readonly> -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" name="txtFPerfilUpdate" id="txtFPerfil" value="{{perfil.nombre}}" placeholder="sub Gerente">
                            <label for="txtFPerfil">nombre perfil </label>
                        </div>
                        <button class="btn">Guardar</button>
                        <!-- <button class="btn" data-bs-toggle="modal" data-bs-target="#modalInsert" >+</button> -->
                    </form>
                </div>
            </div>
        </div>
    </div>
    
{% endblock %}
