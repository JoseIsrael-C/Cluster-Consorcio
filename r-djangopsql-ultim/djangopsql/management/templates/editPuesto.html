{% extends "base.html" %}
{% load static %}

{% block title %} Editar puesto {% endblock %}

{% block content %}
    <div class="row mt-3">
    <div class="col-sm-6 mt-3">
        <div class="row">
            <h1>Actualizar puesto</h1>
            <div class="card" >
                <div class="row">
                    <h1>puesto</h1>
                    <form action="{% url 'updatePuesto' puesto.id %}" method="POST">
                        {% csrf_token %}
                        <!-- <input type="hidden" name="txtIdPerfilUpdate" value="{{perfil.id}}" readonly> -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" value="{{puesto.nombre}}" 
                                name="txtNombreUpPuesto" id="txtNombreUpPuesto"
                                placeholder="Catalogos" 
                            >
                            <label for="txtNombreUpPuesto">Nombre del modulo</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="number" class="form-control" value="{{puesto.borrado}}" 
                                name="txtFborradoUpPuesto" id="txtFborradoUpPuesto"
                                min="0" max="1" placeholder="1 o 0"
                            >
                            <label for="txtFborradoUpPuesto">Estado del modulo</label>
                        </div>
                        <button class="btn">Guardar</button>
                        <!-- <button class="btn" data-bs-toggle="modal" data-bs-target="#modalInsert" >+</button> -->
                    </form>
                </div>
            </div>
        </div>
    </div>
    
{% endblock %}
